services:
  db:
    container_name: zeitmail-db
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Supplied from .env, which compose reads automatically — see .env.example.
      # Deliberately no inline fallback: any literal here is a credential
      # committed to the repository, and postgres/postgres is the first pair
      # anything scanning for exposed databases tries. The postgres image
      # refuses to initialise if this is unset.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zeitmail}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Loopback only. Published on 0.0.0.0 with the default credentials, this
      # port hands anyone who can reach the host the whole database — and with
      # it every user's mail, sidestepping all per-user query scoping.
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
