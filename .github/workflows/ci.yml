name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      # --frozen-lockfile is deliberate: it fails when package.json and bun.lock
      # disagree. That drift is how the repo ended up declaring next 16.2.6
      # while the lockfile still resolved 16.2.3.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Non-blocking until the eslint 10 / eslint-plugin-react incompatibility
      # is resolved: eslint-plugin-react's newest release (7.37.5) declares a
      # peer range topping out at eslint ^9.7, and under eslint 10 it throws
      # "contextOrFilename.getFilename is not a function" before linting a
      # single file. This fails on main too. Fixing it means either pinning
      # eslint to ^9 across the workspace or dropping the plugin — both wider
      # than a security change should reach. Restore blocking once resolved.
      - name: Lint (advisory)
        run: bun run lint
        continue-on-error: true

      - name: Test
        run: bun run --cwd apps/web test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install
        run: bun install --frozen-lockfile

      # Advisory rather than blocking, and deliberately so: the current run
      # reports 25 high findings, essentially all transitive and most of them in
      # dev tooling (eslint, shadcn, turbo). Gating every PR on a set nobody can
      # clear from within that PR makes the check noise, and noise gets ignored.
      # The findings stay in the job log; triage them on their own schedule.
      # continue-on-error goes on the step, not the job — at job level the check
      # run still reports failure.
      - name: Audit dependencies (advisory)
        run: bun audit --audit-level=high
        continue-on-error: true
